name: Table Tennis Flashscore LLM Scraper

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies and Playwright
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright google-genai
          playwright install chromium

      - name: Run LLM-in-the-Loop Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper.py

      - name: Commit and save updated CSV file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add table_tennis_scores.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-updated table tennis scores via LLM Scraper" && git push)
