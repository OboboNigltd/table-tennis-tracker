name: Table Tennis Score Collector

on:
  schedule:
    # Runs automatically every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Lets you trigger it manually anytime

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install required Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scraper script
        run: python scraper.py

      - name: Commit and save updated CSV file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add table_tennis_scores.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-updated table tennis scores" && git push)
